{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">机顶盒广告清理工具</h2>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row align-items-end">
                <div class="col-md-4">
                    <label for="serverIp" class="form-label">服务器 IP</label>
                    <input type="text" class="form-control" id="serverIp" placeholder="例如: 192.168.1.100">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-success w-100" id="btnStart" onclick="startClean()">
                        <i class="fas fa-play"></i> 一键开始清理
                    </button>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-danger w-100" id="btnStop" onclick="stopClean()" style="display: none;" disabled>
                        <i class="fas fa-stop"></i> 停止清理
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            运行日志
        </div>
        <div class="card-body bg-dark text-white font-monospace" id="logArea" style="height: 500px; overflow-y: auto; padding: 15px;">
            <div class="text-muted">等待任务开始...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentTaskId = null;
    let currentEventSource = null;

    // 清理所有遮罩的函数
    function clearAllOverlays() {
        // 清除模态框遮罩
        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
        // 清除加载遮罩
        document.querySelectorAll('.loading-overlay').forEach(el => el.remove());
        // 清除可能残留的模态框
        document.querySelectorAll('.modal.show').forEach(el => {
            if (el.style.display === 'block') {
                el.style.display = 'none';
            }
        });
    }

    // 页面加载时检查是否有正在运行的任务（切换页面返回时自动恢复）
    async function checkRunningTasks() {
        try {
            const result = await ApiClient.get('/clean_ad/api/status', { showLoading: false, showError: false });
            if (result && result.data && result.data.has_running_task && result.data.running_tasks.length > 0) {
                const task = result.data.running_tasks[0];
                const runningMinutes = Math.floor(task.running_time / 60);
                const runningSeconds = task.running_time % 60;
                const timeStr = runningMinutes > 0 ? `${runningMinutes}分${runningSeconds}秒` : `${runningSeconds}秒`;
                currentTaskId = task.task_id;
                $('#btnStart').prop('disabled', true).hide();
                $('#btnStop').removeAttr('disabled').show();
                $('#logArea').html(
                    '<div class="text-warning mb-2">⚠️ 已恢复对运行中任务的监控</div>' +
                    `<div class="text-info">服务器: ${task.server_ip}</div>` +
                    `<div class="text-info">运行时间: ${timeStr}</div>` +
                    '<div class="text-muted mt-3">提示：无法查看切换前的实时日志，但可点击「停止清理」来停止任务。</div>'
                );
                toast.info(`已恢复监控（服务器: ${task.server_ip}，已运行 ${timeStr}）`);
            }
        } catch (error) {
            console.log('检查运行任务失败:', error);
        }
    }

    // 页面加载完成后检查
    $(document).ready(function() {
        checkRunningTasks();
    });

    async function startClean() {
        const ip = $('#serverIp').val();
        if (!ip) {
            toast.warning('请输入服务器IP');
            return;
        }

        // 确认对话框
        const confirmed = await ConfirmDialog.show(
            `确定要开始清理广告吗？将从服务器 ${ip} 获取设备列表并批量清理。`,
            '确认开始清理'
        );
        if (!confirmed) {
            clearAllOverlays();
            return;
        }
        
        // 确保清除所有可能残留的遮罩
        clearAllOverlays();

        // 生成任务ID
        currentTaskId = `clean_${Date.now()}`;
        
        // 更新UI状态
        $('#btnStart').prop('disabled', true).hide();
        $('#btnStop').removeAttr('disabled').show();
        $('#logArea').html(''); // Clear logs
        toast.info('开始清理任务...');

        // 创建 EventSource 连接
        currentEventSource = new EventSource(`/clean_ad/stream_clean?server_ip=${encodeURIComponent(ip)}&task_id=${currentTaskId}`);

        currentEventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.msg) {
                $('#logArea').append(`<div>${data.msg}</div>`);
                // Auto scroll to bottom
                const logDiv = document.getElementById('logArea');
                logDiv.scrollTop = logDiv.scrollHeight;
            }
            
            // 更新任务ID（如果服务器返回了）
            if (data.task_id) {
                currentTaskId = data.task_id;
            }
            
            // 任务完成
            if (data.done) {
                currentEventSource.close();
                currentEventSource = null;
                
                // 恢复UI状态
                $('#btnStart').removeAttr('disabled').show();
                $('#btnStop').hide().removeAttr('disabled');
                
                // 显示最终统计
                if (data.stopped) {
                    toast.warning('清理任务已停止');
                } else {
                    toast.success('清理任务完成！');
                }
                
                // 显示统计信息
                if (data.stats) {
                    const stats = data.stats;
                    const statsMsg = `总计: ${stats.total} | 已处理: ${stats.processed} | 成功: ${stats.success} | 失败: ${stats.failed}${stats.stopped ? ` | 剩余: ${stats.remaining}` : ''}`;
                    $('#logArea').append(`<div class="text-info fw-bold mt-2">${statsMsg}</div>`);
                }
                
                currentTaskId = null;
            }
        };

        currentEventSource.onerror = function(event) {
            console.error("EventSource failed:", event);
            currentEventSource.close();
            currentEventSource = null;
            
            // 恢复UI状态
            $('#btnStart').removeAttr('disabled').show();
            $('#btnStop').hide().removeAttr('disabled');
            
            $('#logArea').append(`<div class="text-danger">连接中断或发生错误</div>`);
            toast.error('连接中断或发生错误');
            currentTaskId = null;
        };
    }

    async function stopClean() {
        if (!currentTaskId) {
            toast.warning('没有运行中的清理任务');
            return;
        }

        // 确认对话框
        const confirmed = await ConfirmDialog.show(
            '确定要停止清理任务吗？当前盒子清理完成后将停止。',
            '确认停止'
        );
        if (!confirmed) {
            clearAllOverlays();
            return;
        }
        
        // 确保清除所有可能残留的遮罩
        clearAllOverlays();

        // 更新按钮状态
        $('#btnStop').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 正在停止...');
        
        try {
            const result = await ApiClient.post('/clean_ad/api/stop', {
                task_id: currentTaskId
            }, {
                showLoading: false,
                showError: false  // 手动处理错误，避免重复提示
            });
            
            // ApiClient 成功返回，检查响应数据
            if (result && (result.success || result.ok)) {
                toast.info(result.message || '停止信号已发送，等待当前盒子清理完成...');
                // 按钮保持"正在停止"状态，直到任务完成（在 onmessage 中恢复）
            } else {
                toast.warning(result?.message || '停止请求失败');
                $('#btnStop').removeAttr('disabled').html('<i class="fas fa-stop"></i> 停止清理');
            }
        } catch (error) {
            // 处理错误情况（如网络错误、404等）
            console.error('停止任务失败:', error);
            const errorMsg = error?.response?.data?.message || error?.message || '停止请求失败';
            toast.error(errorMsg);
            $('#btnStop').removeAttr('disabled').html('<i class="fas fa-stop"></i> 停止清理');
        }
    }
</script>
{% endblock %}

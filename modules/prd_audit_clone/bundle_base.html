<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRD 审计 Clone（独立包）</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}?v=5" rel="stylesheet">
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
        .sidebar { height: 100vh; padding-top: 20px; position: fixed; left: 0; top: 0; width: 250px; overflow-y: auto; }
        .sidebar a { text-decoration: none; padding: 10px 20px; display: flex !important; align-items: center !important; transition: 0.2s; }
        .sidebar i { width: 24px !important; text-align: center !important; margin-right: 10px !important; display: inline-block !important; }
        .sidebar .brand { font-size: 1.25rem; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .main-content { margin-left: 250px; padding: 20px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="sidebar">
    <div class="brand"><i class="fas fa-file-contract"></i> PRD Clone</div>
    <div class="text-uppercase text-white-50 small px-3 mt-2 mb-1">功能</div>
    <a href="/prd_audit_clone/" class="{{ 'active' if request.path.startswith('/prd_audit_clone/') and request.path.count('/') <= 2 else '' }}">
        <i class="fas fa-search"></i> PRD 审计
    </a>
    <a href="/prd_audit_clone/knowledge" class="{{ 'active' if request.path.startswith('/prd_audit_clone/knowledge') else '' }}">
        <i class="fas fa-database"></i> 知识库
    </a>
    <a href="/prd_audit_clone/rules" class="{{ 'active' if request.path.startswith('/prd_audit_clone/rules') else '' }}">
        <i class="fas fa-shield-alt"></i> 规则库
    </a>
    <a href="/prd_audit_clone/bug_patterns" class="{{ 'active' if request.path.startswith('/prd_audit_clone/bug_patterns') else '' }}">
        <i class="fas fa-bug"></i> Bug 模式
    </a>
    <a href="/prd_audit_clone/learning_mvp" class="{{ 'active' if request.path.startswith('/prd_audit_clone/learning_mvp') else '' }}">
        <i class="fas fa-brain"></i> 学习 MVP
    </a>
    <a href="/prd_audit_clone/matrix_view" target="_blank" class="{{ 'active' if request.path.startswith('/prd_audit_clone/matrix_view') else '' }}">
        <i class="fas fa-table"></i> 矩阵视图
    </a>
    <div class="text-uppercase text-white-50 small px-3 mt-3 mb-1">运行</div>
    <a href="/healthz" target="_blank"><i class="fas fa-heartbeat"></i> 健康检查</a>
</div>
<div class="main-content">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}?v=4"></script>
{% block extra_js %}{% endblock %}
</body>
</html>

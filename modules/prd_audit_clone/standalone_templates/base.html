<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}PRD 审计 Clone{% endblock %}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}?v=5" rel="stylesheet">
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f6f8; }
        .clone-topbar { background: #fff; border-bottom: 1px solid #e9ecef; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .clone-brand { font-weight: 700; color: #1a73e8; font-size: 1.1rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="clone-topbar py-2 px-3 mb-0">
    <div class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-2">
        <span class="clone-brand"><i class="fas fa-file-contract me-2"></i>PRD 审计（独立版）</span>
        <span class="small text-muted">仅 PRD 分析能力 · 无运维平台其它模块</span>
    </div>
</div>
{% block content %}{% endblock %}
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}?v=4"></script>
{% block extra_js %}{% endblock %}
</body>
</html>

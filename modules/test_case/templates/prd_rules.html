{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="fas fa-shield-alt text-primary me-2"></i>PRD 漏洞扫描规则库</h2>
        <div>
            <a href="/test_case/#prd_review" class="btn btn-outline-primary me-2">
                <i class="fas fa-file-alt me-1"></i>PRD 漏洞分析
            </a>
            <button class="btn btn-success" onclick="saveRules()">
                <i class="fas fa-save me-1"></i>保存全部
            </button>
        </div>
    </div>

    <p class="text-muted mb-3">30 条核心检测规则，按 6 大类组织；用于 PRD 自动审计与需求评审。勾选「核心」的 10 条为大厂最常用，可覆盖约 70% PRD 问题。</p>

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-header bg-light py-2">
            <button class="btn btn-link btn-sm text-decoration-none p-0 w-100 text-start" type="button" data-bs-toggle="collapse" data-bs-target="#ruleHelp">
                <i class="fas fa-info-circle me-1"></i>使用说明（点击展开）
            </button>
        </div>
        <div class="collapse" id="ruleHelp">
            <div class="card-body small">
                <p class="mb-1">规则库会在 <strong>PRD 漏洞分析</strong> 时被引用，用于指导模型按这些维度扫描 PRD。</p>
                <p class="mb-0">可编辑规则名称、描述、示例、风险说明；取消「启用」后，该规则在扫描时可被跳过。</p>
            </div>
        </div>
    </div>

    <div class="accordion" id="rulesAccordion">
        <!-- 6 大类由 JS 渲染 -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const CATEGORY_NAMES = {
        consistency: '一、业务规则一致性',
        state_machine: '二、状态机完整性',
        flow: '三、流程完整性',
        data: '四、数据完整性',
        testability: '五、可测试性',
        technical: '六、技术与系统风险'
    };
    const CATEGORY_ORDER = ['consistency', 'state_machine', 'flow', 'data', 'testability', 'technical'];

    let rulesData = { version: '1.0', description: '', categories: [], rules: [] };

    function escapeHtml(text) {
        if (text == null) return '';
        const s = String(text);
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    function getRulesByCategory(catId) {
        return (rulesData.rules || []).filter(r => r.category === catId).sort((a, b) => (a.id || 0) - (b.id || 0));
    }

    function renderRuleRow(r) {
        const coreBadge = r.core ? '<span class="badge bg-warning text-dark">核心</span>' : '';
        return '<tr data-id="' + r.id + '">' +
            '<td class="text-center">' + r.id + '</td>' +
            '<td><input type="text" class="form-control form-control-sm rule-name" value="' + escapeHtml(r.name || '') + '" placeholder="规则名"></td>' +
            '<td><textarea class="form-control form-control-sm rule-desc" rows="2" placeholder="描述">' + escapeHtml(r.description || '') + '</textarea></td>' +
            '<td><textarea class="form-control form-control-sm rule-example" rows="2" placeholder="示例">' + escapeHtml(r.example || '') + '</textarea></td>' +
            '<td><input type="text" class="form-control form-control-sm rule-risk" value="' + escapeHtml(r.risk || '') + '" placeholder="风险"></td>' +
            '<td class="text-center">' + coreBadge + '</td>' +
            '<td class="text-center"><input type="checkbox" class="form-check-input rule-enabled" ' + (r.enabled !== false ? 'checked' : '') + '></td>' +
            '</tr>';
    }

    function syncTableToRules(catId) {
        const tbody = document.querySelector('#cat-' + catId + ' tbody');
        if (!tbody) return;
        const rows = tbody.querySelectorAll('tr[data-id]');
        const ruleIds = getRulesByCategory(catId).map(r => r.id);
        rows.forEach(tr => {
            const id = parseInt(tr.getAttribute('data-id'), 10);
            const rule = rulesData.rules.find(r => r.id === id);
            if (!rule) return;
            rule.name = (tr.querySelector('.rule-name') || {}).value || '';
            rule.description = (tr.querySelector('.rule-desc') || {}).value || '';
            rule.example = (tr.querySelector('.rule-example') || {}).value || '';
            rule.risk = (tr.querySelector('.rule-risk') || {}).value || '';
            rule.enabled = (tr.querySelector('.rule-enabled') || {}).checked;
        });
    }

    function renderCategory(catId, index) {
        const name = CATEGORY_NAMES[catId] || catId;
        const rules = getRulesByCategory(catId);
        const collapsed = index > 0 ? 'collapse' : 'show';
        const accordionId = 'acc-' + catId;
        let html = '<div class="accordion-item">' +
            '<h2 class="accordion-header">' +
            '<button class="accordion-button ' + (index > 0 ? 'collapsed' : '') + '" type="button" data-bs-toggle="collapse" data-bs-target="#' + accordionId + '">' +
            name + ' <span class="badge bg-secondary ms-2">' + rules.length + ' 条</span></button></h2>' +
            '<div id="' + accordionId + '" class="accordion-collapse ' + collapsed + '" data-bs-parent="#rulesAccordion">' +
            '<div class="accordion-body p-0">' +
            '<div class="table-responsive">' +
            '<table class="table table-bordered table-hover align-middle mb-0">' +
            '<thead class="table-light">' +
            '<tr><th style="width:4%">#</th><th style="width:14%">规则名</th><th style="width:26%">描述</th><th style="width:26%">示例</th><th style="width:18%">风险</th><th style="width:6%">核心</th><th style="width:6%">启用</th></tr>' +
            '</thead><tbody id="cat-' + catId + '">';
        rules.forEach(r => { html += renderRuleRow(r); });
        html += '</tbody></table></div></div></div></div>';
        return html;
    }

    function renderAll() {
        const accordion = document.getElementById('rulesAccordion');
        accordion.innerHTML = CATEGORY_ORDER.map((catId, i) => renderCategory(catId, i)).join('');
    }

    async function loadRules() {
        try {
            const res = await ApiClient.get('/test_case/api/prd_scan_rules');
            rulesData = res.data || { version: '1.0', categories: [], rules: [] };
            if (!Array.isArray(rulesData.rules)) rulesData.rules = [];
            if (!Array.isArray(rulesData.categories)) rulesData.categories = [];
            renderAll();
        } catch (e) {
            console.error('加载规则库失败', e);
            toast.error(e.message || '加载规则库失败');
        }
    }

    function syncAllTablesToRules() {
        CATEGORY_ORDER.forEach(catId => syncTableToRules(catId));
    }

    async function saveRules() {
        try {
            syncAllTablesToRules();
            await ApiClient.post('/test_case/api/prd_scan_rules', rulesData);
            toast.success('规则库已保存');
        } catch (e) {
            console.error('保存规则库失败', e);
            toast.error(e.message || '保存规则库失败');
        }
    }

    $(document).ready(loadRules);
</script>
{% endblock %}

{% extends "ui_automation_base.html" %}

{% block module_content %}
<!-- 头部：任务入口 -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card border-0 shadow-sm bg-primary text-white" style="background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);">
            <div class="card-body p-4 p-lg-5">
                <div class="row align-items-center">
                    <div class="col-lg-7">
                        <h2 class="fw-bold mb-2"><i class="fas fa-flask me-2"></i>UI 自动化用例工作台</h2>
                        <p class="mb-0 opacity-75">AI 探索或手动录制 → 固化脚本 → 套件回归 → 失败归因（人工在环）</p>
                    </div>
                    <div class="col-lg-5 text-lg-end mt-3 mt-lg-0">
                        <a href="/ui_automation/ai" class="btn btn-light btn-lg text-primary fw-bold shadow-sm px-4 me-2">
                            <i class="fas fa-robot me-2"></i>AI 探索生成
                        </a>
                        <a href="/ui_automation/recorder?new=1" class="btn btn-outline-light btn-lg fw-bold px-4">
                            <i class="fas fa-plus-circle me-2"></i>手动录制
                        </a>
                        <div class="mt-2">
                            <a href="/ui_automation/recorder?continue=1" class="text-white-50 small text-decoration-none me-3 hover-light">
                                <i class="fas fa-history me-1"></i>继续上次录制
                            </a>
                            <a href="/ui_automation/cases" class="text-white-50 small text-decoration-none hover-light">
                                <i class="fas fa-play me-1"></i>执行已有用例
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 内容区：双面板 -->
<div class="row">
    <!-- 左侧：最近用例 -->
    <div class="col-lg-7 mb-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0 fw-bold"><i class="fas fa-folder-open me-2 text-primary"></i>最近用例</h5>
                <a href="/ui_automation/cases" class="btn btn-sm btn-outline-primary rounded-pill">查看全部</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">用例名称</th>
                                <th>步骤数</th>
                                <th>创建时间</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="recentCasesTable">
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                    加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：设备与环境状态 -->
    <div class="col-lg-5 mb-4">
        <!-- 设备状态 -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0 fw-bold"><i class="fas fa-mobile-alt me-2 text-success"></i>设备状态</h5>
            </div>
            <div class="card-body" id="deviceStatusPanel">
                <div class="text-center py-3 text-muted">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                    检测设备中...
                </div>
            </div>
        </div>

        <!-- 最近执行汇总 -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0 fw-bold"><i class="fas fa-history me-2 text-info"></i>最近执行</h5>
                <a href="/ui_automation/reports" class="btn btn-sm btn-outline-info rounded-pill">查看全部</a>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush" id="recentExecutionsList">
                    <div class="list-group-item text-center py-3 text-muted">
                        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                        加载中...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 最近失败（如有） -->
<div class="row" id="failureSection" style="display:none;">
    <div class="col-12 mb-4">
        <div class="card border-0 shadow-sm border-start border-danger border-4">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0 fw-bold"><i class="fas fa-exclamation-triangle me-2 text-danger"></i>最近失败</h5>
                <a href="/ui_automation/reports" class="btn btn-sm btn-outline-danger rounded-pill">查看详情</a>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush" id="recentFailuresList"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function() {
        loadWorkspaceData();
        checkDeviceStatus();
    });

    async function loadWorkspaceData() {
        try {
            const result = await ApiClient.get('/ui_automation/api/stats');
            if (!result || !result.success || !result.data) return;
            const data = result.data;

            renderRecentCases(data.recent_cases || []);
            renderRecentExecutions(data.recent_reports || []);
            renderRecentFailures(data.recent_failures || []);
        } catch (error) {
            console.error('获取工作台数据失败:', error);
        }
    }

    function renderRecentCases(cases) {
        const tbody = $('#recentCasesTable');
        tbody.empty();

        if (cases.length === 0) {
            tbody.append('<tr><td colspan="4" class="text-center py-4 text-muted">还没有用例，点击右上角"新建 UI 用例"开始</td></tr>');
            return;
        }

        cases.forEach(function(c) {
            const name = c.name || c.description || '未命名用例';
            const steps = c.action_count || 0;
            const time = c.created_at ? new Date(c.created_at).toLocaleDateString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
            const tr = `
                <tr>
                    <td class="ps-4">
                        <a href="/ui_automation/recorder?load=${c.id}" class="fw-bold text-decoration-none">${escapeHtml(name)}</a>
                    </td>
                    <td><span class="badge bg-light text-secondary">${steps} 步</span></td>
                    <td class="text-muted small">${time}</td>
                    <td class="text-end pe-3">
                        <a href="/ui_automation/recorder?load=${c.id}" class="btn btn-sm btn-outline-secondary rounded-pill" title="编辑">编辑</a>
                        <a href="/ui_automation/reports" class="btn btn-sm btn-outline-primary rounded-pill ms-1" title="执行">执行</a>
                    </td>
                </tr>`;
            tbody.append(tr);
        });
    }

    function renderRecentExecutions(reports) {
        const list = $('#recentExecutionsList');
        list.empty();

        if (reports.length === 0) {
            list.append('<div class="list-group-item text-center py-4 text-muted">暂无执行记录</div>');
            return;
        }

        reports.slice(0, 5).forEach(function(r) {
            const name = r.suite_name || '未命名执行';
            const time = r.start_time ? new Date(r.start_time * 1000).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
            const duration = r.end_time && r.start_time ? ((r.end_time - r.start_time).toFixed(1) + 's') : '-';

            let badge = '';
            if (r.status === 'completed') {
                badge = '<span class="badge bg-success rounded-pill ms-2">通过</span>';
            } else if (r.status === 'running') {
                badge = '<span class="badge bg-primary rounded-pill ms-2">运行中</span>';
            } else if (r.status === 'failed' || r.status === 'error') {
                badge = '<span class="badge bg-danger rounded-pill ms-2">失败</span>';
            } else if (r.status === 'stopped') {
                badge = '<span class="badge bg-warning text-dark rounded-pill ms-2">已停止</span>';
            }

            list.append(`
                <a href="/ui_automation/reports" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                    <div>
                        <span class="fw-medium">${escapeHtml(name)}</span>
                        ${badge}
                        <div class="text-muted small mt-1">${time} &middot; 耗时 ${duration}</div>
                    </div>
                    <i class="fas fa-chevron-right text-muted"></i>
                </a>`);
        });
    }

    function renderRecentFailures(failures) {
        if (!failures || failures.length === 0) {
            $('#failureSection').hide();
            return;
        }
        $('#failureSection').show();

        const list = $('#recentFailuresList');
        list.empty();

        failures.forEach(function(r) {
            const name = r.suite_name || '未命名执行';
            const time = r.start_time ? new Date(r.start_time * 1000).toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';

            list.append(`
                <a href="/ui_automation/reports" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-start-0 border-end-0">
                    <div>
                        <span class="fw-medium">${escapeHtml(name)}</span>
                        <span class="badge bg-danger rounded-pill ms-2">失败</span>
                        <div class="text-muted small mt-1">${time}</div>
                    </div>
                    <div>
                        <span class="btn btn-sm btn-outline-danger rounded-pill me-2">查看失败原因</span>
                        <span class="btn btn-sm btn-outline-primary rounded-pill">重跑</span>
                    </div>
                </a>`);
        });
    }

    async function checkDeviceStatus() {
        try {
            const result = await ApiClient.get('/ui_automation/api/devices');
            const panel = $('#deviceStatusPanel');

            if (!result || !result.success) {
                panel.html('<div class="text-center py-3 text-danger"><i class="fas fa-times-circle me-2"></i>无法获取设备状态</div>');
                return;
            }

            const devices = result.data || [];
            if (devices.length === 0) {
                panel.html(`
                    <div class="text-center py-3 text-warning">
                        <i class="fas fa-plug me-2"></i>未检测到已连接设备
                        <div class="mt-2 small text-muted">请通过 USB 连接 Android 设备并开启 USB 调试</div>
                    </div>`);
                return;
            }

            let html = '';
            devices.forEach(function(d) {
                const statusIcon = d.status === 'device' ? '<i class="fas fa-circle text-success me-2" style="font-size:0.5em; vertical-align:middle;"></i>' : '<i class="fas fa-circle text-warning me-2" style="font-size:0.5em; vertical-align:middle;"></i>';
                html += `
                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                        <div>
                            ${statusIcon}
                            <span class="fw-medium">${escapeHtml(d.model || d.serial || d.device_id || '未知设备')}</span>
                        </div>
                        <span class="text-muted small">已连接</span>
                    </div>`;
            });
            panel.html(html);
        } catch (error) {
            $('#deviceStatusPanel').html('<div class="text-center py-3 text-muted">设备检测失败，请刷新重试</div>');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
{% endblock %}

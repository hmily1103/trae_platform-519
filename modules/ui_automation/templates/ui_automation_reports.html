{% extends "ui_automation_base.html" %}

{% block module_content %}
<div class="d-flex justify-content-between flex-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-chart-bar me-2"></i>执行记录</h1>
    <a href="/ui_automation/" class="btn btn-sm btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i> 返回仪表盘
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h5 class="mb-0">全部执行记录</h5>
        <button class="btn btn-sm btn-outline-primary" onclick="loadReports()">
            <i class="fas fa-sync-alt me-1"></i> 刷新
        </button>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">#</th>
                        <th>任务名称</th>
                        <th>项目</th>
                        <th>触发时间</th>
                        <th>耗时</th>
                        <th>通过率</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="reportList">
                    <tr>
                        <td colspan="7" class="text-center py-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            加载中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadReports();
});

async function loadReports() {
    const tbody = $('#reportList');
    tbody.html('<tr><td colspan="7" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>加载中...</td></tr>');

    try {
        const result = await ApiClient.get('/ui_automation/api/reports', { showLoading: false });
        const reports = (result && result.data && result.data.reports) || [];

        tbody.empty();
        if (reports.length === 0) {
            tbody.append('<tr><td colspan="7" class="text-center py-5 text-muted">暂无执行记录</td></tr>');
            return;
        }

        reports.forEach((report, idx) => {
            const startTime = report.start_time ? new Date(report.start_time * 1000).toLocaleString() : '-';
            const duration = (report.end_time && report.start_time) ? ((report.end_time - report.start_time).toFixed(1) + 's') : '-';
            const passRate = report.pass_rate != null ? report.pass_rate.toFixed(1) + '%' : '-';

            let statusBadge = '<span class="badge bg-secondary">未知</span>';
            if (report.status === 'completed') {
                statusBadge = '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>完成</span>';
            } else if (report.status === 'running') {
                statusBadge = '<span class="badge bg-primary"><i class="spinner-border spinner-border-sm me-1" style="width: 0.7em; height: 0.7em;"></i>运行中</span>';
            } else if (report.status === 'failed' || report.status === 'error') {
                statusBadge = '<span class="badge bg-danger"><i class="fas fa-times-circle me-1"></i>失败</span>';
            } else if (report.status === 'stopped') {
                statusBadge = '<span class="badge bg-warning text-dark"><i class="fas fa-pause-circle me-1"></i>停止</span>';
            }

            const tr = `
                <tr>
                    <td class="ps-4 text-muted">${idx + 1}</td>
                    <td><span class="fw-bold">${report.suite_name || '未命名套件'}</span></td>
                    <td><span class="badge bg-light text-secondary border">${report.project_name || '-'}</span></td>
                    <td class="text-muted small">${startTime}</td>
                    <td class="text-muted small">${duration}</td>
                    <td>${passRate}</td>
                    <td>${statusBadge}</td>
                </tr>
            `;
            tbody.append(tr);
        });
    } catch (error) {
        tbody.html('<tr><td colspan="7" class="text-center py-5 text-danger">加载失败: ' + (error.message || '未知错误') + '</td></tr>');
    }
}
</script>
{% endblock %}
